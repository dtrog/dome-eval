# Milestone 1: one end-to-end call, fully logged.
# Goal: prove the plumbing works, not measure anything.
id: m1-smoke
hypothesis: hypotheses/001-smoke.md
stage: generate

backend: lmstudio
model: qwen/qwen3.5-9b          # use the exact identifier LM Studio shows
weights_path: null              # optional: path to model file/dir to hash into the manifest

prompts: data/prompts/smoke.jsonl

sampling:
  temperature: 0.0
  max_tokens: 10024
  seed: 1234

# Backend-specific extras passed straight through (e.g. disabling a thinking mode).
# Qwen3.5 thinks by default and spends all of max_tokens on reasoning, leaving content empty.
# LM Studio ignores chat_template_kwargs and /no_think; reasoning_effort "none" works.
extra_body:
  reasoning_effort: none
